name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also start the on-demand mutation job below.
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, tests, build, dist syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck + vitest (incl. exhaustive render sweep,
      # doc-sync, invariants) + build + es-check dist syntax gate
      - run: npm run verify

  browser:
    name: Real-pixel and canvas-contract tests (Chromium)
    runs-on: ubuntu-24.04  # the locked Playwright does not support Ubuntu 26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the IIFE bundle, then runs tests/visual (pixel probes +
      # Linux-Chromium goldens) and tests/contract (strict-mock contract)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mutation:
    name: Mutation testing (core boundary)
    # On demand only: 16 weekly runs re-scored unchanged main (73.86%,
    # ~10 min) and changed no decision. The es-check gate, the vitest suite
    # and the existing Chromium suites remain the per-change gates.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
