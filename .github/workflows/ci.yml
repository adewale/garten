name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also start the on-demand mutation job below.
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, tests, build, dist syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck + vitest (incl. exhaustive render sweep,
      # doc-sync, invariants) + build + es-check dist syntax gate
      - run: npm run verify

  browser:
    name: Real-pixel and canvas-contract tests (Chromium)
    runs-on: ubuntu-24.04  # the locked Playwright does not support Ubuntu 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the IIFE bundle, then runs tests/visual (pixel probes +
      # Linux-Chromium goldens) and tests/contract (strict-mock contract)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  mutation:
    name: Mutation testing (core boundary)
    # On demand only: 16 weekly runs re-scored unchanged main (73.86%,
    # ~10 min) and changed no decision. The es-check gate, the vitest suite
    # and the existing Chromium suites remain the per-change gates.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:mutation:core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
