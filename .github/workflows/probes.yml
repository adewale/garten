name: Defect probes

# Re-applies each of the 12 defects from the June 2026 audit
# (scripts/defect-probes/*.patch) and fails if the vitest suite still passes
# with any of them. Runs only when the code, the suite, the probes or the
# test configuration change (keep the two path lists in sync); path filters
# apply per workflow, hence a separate file from ci.yml.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/defect-probes/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vitest.stryker.config.ts'
      - 'stryker.config.json'
      - '.github/workflows/probes.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/defect-probes/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vitest.stryker.config.ts'
      - 'stryker.config.json'
      - '.github/workflows/probes.yml'
  workflow_dispatch:

jobs:
  probes:
    name: Defect-reintroduction probes (12 historical defects)
    # ~2 min; blocks a merge that stops killing a previously shipped defect.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:probes
